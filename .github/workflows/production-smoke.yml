name: PM Agent production smoke

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Deployed PM Agent URL"
        required: true
        default: "https://pm-agent-v2.vercel.app"
      require_release_marker:
        description: "Require the deployed release marker"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run read-only production smoke
        env:
          PM_PRODUCTION_URL: ${{ inputs.production_url }}
          PM_REQUIRE_RELEASE_MARKER: ${{ inputs.require_release_marker && 'true' || 'false' }}
        run: node scripts/production-smoke.mjs
